[project]
name = "llm-mirror"
version = "0.1.0"
description = "Two personas of one local model, talking to each other"
requires-python = "==3.15.0"
dependencies = ["httpx==0.28.1", "rich==15.0.0", "textual==8.2.8"]
license = {text = "Apache-2.0"}

[project.scripts]
llm-mirror = "llm_mirror.main:main"

[project.entry-points."llm_mirror.packages"]
debate = "llm_mirror.packages.debate:DebatePackage"
roleplay = "llm_mirror.packages.roleplay:RoleplayPackage"
improv = "llm_mirror.packages.improv:ImprovPackage"

[dependency-groups]
dev = ["ruff==0.17.0", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_mirror"]
